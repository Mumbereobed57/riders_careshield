name: riders_careshield
description: CareShield Riders - Delivery app for medication riders
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Network & API
  dio: ^5.4.3+1

  # Local Storage
  flutter_secure_storage: ^9.1.1
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  cupertino_icons: ^1.0.8

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.5
  uuid: ^4.4.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/rider_logo.png
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/rider_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/images/rider_logo.png"
